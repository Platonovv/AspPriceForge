apiVersion: apps/v1
kind: Deployment
metadata:
  name: priceforge-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: priceforge-api
  template:
    metadata:
      labels:
        app: priceforge-api
    spec:
      containers:
        - name: api
          image: priceforge-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: priceforge-config
            - secretRef:
                name: priceforge-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: priceforge-api
spec:
  type: LoadBalancer
  selector:
    app: priceforge-api
  ports:
    - port: 8080
      targetPort: 8080
