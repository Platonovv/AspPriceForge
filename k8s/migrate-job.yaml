apiVersion: batch/v1
kind: Job
metadata:
  name: priceforge-migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: priceforge-migrate:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: priceforge-config
            - secretRef:
                name: priceforge-secrets
