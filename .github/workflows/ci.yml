name: CI


on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal


  api-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve base revision
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if git cat-file -e "$BASE:openapi.json" 2>/dev/null; then
            echo "ref=$BASE" >> "$GITHUB_OUTPUT"
          else
            echo "No openapi.json in $BASE, breaking-change check skipped"
          fi

      - name: Check for breaking changes
        if: steps.base.outputs.ref != ''
        uses: oasdiff/oasdiff-action/breaking@v0
        with:
          base: '${{ steps.base.outputs.ref }}:openapi.json'
          revision: 'HEAD:openapi.json'
          fail-on: ERR
          review: false


  build-push-image:
    needs: [ build-test, api-contract ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/PriceForge.Api/Dockerfile
          push: true
          tags: |
            ghcr.io/platonovv/priceforge-api:latest
            ghcr.io/platonovv/priceforge-api:${{ github.sha }}
